name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_drf_project:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'your-dummy-secret-key-for-ci-testing'
      DEBUG: 'True'
      DB_URL: 'sqlite:///db.sqlite3'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir flake8

      - name: Code Quality Check (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Migration Check
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate Test Database
        run: python manage.py migrate

      - name: Run DRF API Tests
        run: python manage.py test


  deploy_to_server:
    runs-on: ubuntu-latest
    needs: test_drf_project
    # Only run deployment on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy via SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SERVER_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT=${SERVER_PORT:-22}
          ssh-keyscan -p $PORT -H $SERVER_IP >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/id_rsa -p $PORT $SERVER_USER@$SERVER_IP "
            cd ~/Apheenx &&
            echo 'Current directory:' && pwd &&
            git reset --hard &&
            GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no' git pull origin main &&
            docker compose up -d --build --remove-orphans &&
            docker compose exec -T web python manage.py migrate
          "